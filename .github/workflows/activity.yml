name: Refresh GitHub activity

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_activity.py'
      - 'tests/test_activity.py'
      - '.github/workflows/activity.yml'
  pull_request:
    paths:
      - 'scripts/update_activity.py'
      - 'tests/test_activity.py'
      - '.github/workflows/activity.yml'

concurrency:
  group: github-activity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s tests -v
      - name: Generate from live GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Validate SVG
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('assets/github-activity.svg')"

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh contribution graphic
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Commit changed graphic
        run: |
          git add assets/github-activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh GitHub contribution activity'
          git pull --rebase origin main
          git push origin HEAD:main
