le">24h</text><text x="794.0" y="87.0" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">The Crystal</text><text x="794.0" y="103.0" font-size="10" fill="#57606a" font-weight="400" text-anchor="start">Redraws this board every day</text><line x1="34" y1="118" x2="966" y2="118" stroke="#d0d7de"/><text x="500.0" y="138.0" font-size="10" fill="#8c959f" font-weight="400" text-anchor="middle">The moving dots are just data flowing · Redrawn every day by a GitHub Action</text></svg>
