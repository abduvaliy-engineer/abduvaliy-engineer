<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="174" viewBox="0 0 1000 174" role="img" aria-label="Key: the CPU is me, chips are projects, gold means merged upstream."><title>Key: the CPU is me, chips are projects, gold means merged upstream.</title><style>text{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-variant-ligatures:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4ec"/><stop offset="1" stop-color="#dfe9dc"/></linearGradient><radialGradient id="vg" cx=".5" cy=".46" r=".72"><stop offset=".55" stop-color="#dfe9dc" stop-opacity="0"/><stop offset="1" stop-color="#dfe9dc" stop-opacity=".75"/></radialGradient><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#000000" fill-opacity="0.05"/></pattern><pattern id="pv" width="7.0" height="6" patternUnits="userSpaceOnUse"><rect y=".6" width="7.0" height="2.8" rx=".6" fill="#8a929c"/></pattern><pattern id="ph" width="6" height="7.0" patternUnits="userSpaceOnUse"><rect x=".6" width="2.8" height="7.0" rx=".6" fill="#8a929c"/></pattern><pattern id="pvg" width="7.0" height="6" patternUnits="userSpaceOnUse"><rect y=".6" width="7.0" height="2.8" rx=".6" fill="#cf9310"/></pattern><pattern id="phg" width="6" height="7.0" patternUnits="userSpaceOnUse"><rect x=".6" width="2.8" height="7.0" rx=".6" fill="#cf9310"/></pattern><radialGradient id="pg"><stop offset="0" stop-color="#ff8c1a" stop-opacity=".95"/><stop offset="1" stop-color="#ff8c1a" stop-opacity="0"/></radialGradient><radialGradient id="cg"><stop offset="0" stop-color="#cf9310" stop-opacity=".30"/><stop offset="1" stop-color="#cf9310" stop-opacity="0"/></radialGradient><linearGradient id="ihs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b414b"/><stop offset="1" stop-color="#2